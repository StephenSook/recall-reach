name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Going public doesn't push anything, so this is what makes the public-flip guard run at that moment.
  public:

# Every push to main gets its own group (keyed on the SHA) so a quick follow-up
# push never cancels the run that gives the previous commit its verdict.
# Branch and PR runs still supersede each other.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: node --no-warnings --experimental-strip-types scripts/publicGuard.ts
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm claims
      - run: pnpm build

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose --exit-code 1 .
