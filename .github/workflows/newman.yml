name: Newman

# Run the public collection against the deployed site twice a day through judging, then retire after 2026-12-22.
# No push trigger: Render deploys a commit only after its checks pass (render.yaml autoDeployTrigger: checksPass),
# so a check that waited for its own commit's deploy would hold that deploy back. Like probe.yml, its check-run
# pins to whatever commit is the branch head, so a verdict on a commit should leave "newman" out.
on:
  schedule:
    - cron: "23 11 * * *"
    - cron: "23 23 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to read. Point it at a wrong address to watch it fail.
        required: false
        default: https://recall-reach-web-e022.onrender.com

permissions:
  contents: read

jobs:
  newman:
    name: newman
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: ${{ inputs.base_url || 'https://recall-reach-web-e022.onrender.com' }}
    steps:
      - name: Retire after judging
        id: retirement
        run: |
          if [[ "$(date -u +%F)" > "2026-12-22" ]]; then
            echo "retired: Newman only had to run through 2026-12-22"
            exit 0
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.retirement.outputs.active == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.retirement.outputs.active == 'true'
        with:
          node-version: 22
      - name: Say which build is deployed
        if: steps.retirement.outputs.active == 'true'
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL.replace(/\/$/, "");
          try {
            const response = await fetch(`${base}/api/health`, { signal: AbortSignal.timeout(60_000), cache: "no-store" });
            const health = await response.json();
            console.log(`deployed build ${typeof health?.build === "string" ? health.build : "(missing build)"}, HTTP ${response.status}`);
          } catch (err) {
            console.log(`health unavailable before the run: ${err.message}`);
          }
          NODE
      - name: Run the public collection
        id: newman
        if: steps.retirement.outputs.active == 'true'
        run: npx --yes newman@6.2.3 run postman/recall-reach.postman_collection.json --env-var "baseUrl=$BASE_URL" --reporters cli,json --reporter-json-export newman.json
      - name: Check the counts
        if: ${{ !cancelled() && (steps.newman.outcome == 'success' || steps.newman.outcome == 'failure') }}
        run: node --experimental-strip-types scripts/newman-floor.ts newman.json
